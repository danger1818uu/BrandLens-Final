<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#08090D"/><stop offset=".55" stop-color="#11111D"/><stop offset="1" stop-color="#090D13"/></linearGradient>
    <linearGradient id="rail" x1="100" x2="1100" gradientUnits="userSpaceOnUse"><stop stop-color="#A68BFF"/><stop offset="1" stop-color="#9CECFF"/></linearGradient>
    <filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <path id="track" d="M110 120H1090"/>
  </defs>
  <style>
    .t{font-family:Manrope,'Segoe UI',Arial,sans-serif;font-size:17px;font-weight:700;fill:#F5F3FA;text-anchor:middle}
    .s{font-family:'DM Mono',Consolas,monospace;font-size:11px;letter-spacing:1.4px;fill:#8F8D9D;text-anchor:middle}
    .n{font-family:'DM Mono',Consolas,monospace;font-size:10px;letter-spacing:2px;fill:#6F6D7C;text-anchor:middle}
    .ring{fill:#11111D;stroke:#3A3556;stroke-width:1.5;animation:lit 10s infinite}
    .r2{animation-delay:2s}.r3{animation-delay:4s}.r4{animation-delay:6s}.r5{animation-delay:8s}
    @keyframes lit{0%{stroke:#9CECFF;fill:#1B1830}2%,16%{stroke:#C7B5FF;fill:#1B1830}20%,100%{stroke:#3A3556;fill:#11111D}}
    .ic{stroke:#C7B5FF;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g opacity=".05" stroke="#B6A5F1"><path d="M0 75H1200M0 150H1200M0 225H1200M300 0V300M600 0V300M900 0V300"/></g>

  <!-- rail -->
  <path d="M110 120H1090" stroke="#2A2742" stroke-width="2"/>
  <path d="M110 120H1090" stroke="url(#rail)" stroke-width="2" stroke-dasharray="6 10" opacity=".6">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- needs-changes loop -->
  <path d="M845 156 C845 222 600 222 600 156" stroke="#A68BFF" stroke-opacity=".45" stroke-dasharray="3 6" stroke-width="1.5" fill="none"/>
  <text class="n" x="722" y="244">NEEDS CHANGES → BACK TO IMPROVE</text>

  <!-- traveling pulse -->
  <g>
    <circle r="9" fill="#9CECFF" opacity=".5" filter="url(#gl)"/><circle r="4" fill="#fff"/>
    <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#track"/></animateMotion>
  </g>

  <!-- nodes -->
  <g transform="translate(110 120)"><circle class="ring" r="34"/>
    <path class="ic" d="M-10 10l2-7 12-12 5 5-12 12z M3 -7l5 5"/>
    <text class="t" y="64">Draft</text><text class="s" y="82">CREATE</text></g>
  <g transform="translate(355 120)"><circle class="ring r2" r="34"/>
    <circle class="ic" cx="-2" cy="-2" r="9"/><path class="ic" d="M5 5l8 8"/>
    <text class="t" y="64">AI Review</text><text class="s" y="82">COMPANY-AWARE</text></g>
  <g transform="translate(600 120)"><circle class="ring r3" r="34"/>
    <path class="ic" d="M0 -14l3.5 9 9 3.5-9 3.5L0 5l-3.5-9-9-3.5 9-3.5z" transform="translate(0 4) scale(.9)"/>
    <text class="t" y="64">Improve</text><text class="s" y="82">REFINE</text></g>
  <g transform="translate(845 120)"><circle class="ring r4" r="34"/>
    <path class="ic" d="M-11 1l7 7 15-15"/>
    <text class="t" y="64">Approve</text><text class="s" y="82">HUMAN-IN-THE-LOOP</text></g>
  <g transform="translate(1090 120)"><circle class="ring r5" r="34"/>
    <path class="ic" d="M-10 10l20-20M2 -10h8v8M-12 -4v14h14"/>
    <text class="t" y="64">Publish</text><text class="s" y="82">CONNECTED</text></g>

  <text class="n" x="600" y="23">THE BRANDLENS CONTENT PIPELINE</text>
</svg>
