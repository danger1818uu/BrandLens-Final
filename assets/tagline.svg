<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="g" x1="0" x2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#C7B5FF"/><stop offset=".5" stop-color="#A68BFF"/><stop offset="1" stop-color="#9CECFF"/></linearGradient></defs>
  <style>
    text{font-family:'DM Mono',Consolas,'Courier New',monospace;font-size:20px;fill:url(#g);text-anchor:middle}
    .p{opacity:0;animation:cyc 15s infinite}
    .p2{animation-delay:3s}.p3{animation-delay:6s}.p4{animation-delay:9s}.p5{animation-delay:12s}
    @keyframes cyc{0%{opacity:0;transform:translateY(10px)}4%,17%{opacity:1;transform:translateY(0)}21%,100%{opacity:0;transform:translateY(-10px)}}
    .cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
  </style>
  <text class="p" x="450" y="34">▸ Review with context</text>
  <text class="p p2" x="450" y="34">▸ Create with clarity</text>
  <text class="p p3" x="450" y="34">▸ Publish with control</text>
  <text class="p p4" x="450" y="34">▸ One workspace. Every team.</text>
  <text class="p p5" x="450" y="34">▸ One consistent brand.</text>
</svg>
