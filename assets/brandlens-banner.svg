<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BrandLens — Clarity in Every Impression</title>
  <defs>
    <linearGradient id="bg" x1="80" y1="0" x2="1480" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08090D"/><stop offset=".55" stop-color="#11111D"/><stop offset="1" stop-color="#090D13"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="matrix(520 0 0 300 1090 200)" gradientUnits="userSpaceOnUse"><stop stop-color="#8B6BDB" stop-opacity=".25"/><stop offset="1" stop-color="#8B6BDB" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="matrix(330 0 0 240 360 430)" gradientUnits="userSpaceOnUse"><stop stop-color="#65CFE0" stop-opacity=".13"/><stop offset="1" stop-color="#65CFE0" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="620" y1="125" x2="1100" y2="245" gradientUnits="userSpaceOnUse"><stop stop-color="#C7B5FF"/><stop offset=".52" stop-color="#A68BFF"/><stop offset="1" stop-color="#9CECFF"/></linearGradient>
    <linearGradient id="line" x1="330" y1="0" x2="1330" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#A68BFF" stop-opacity="0"/><stop offset=".5" stop-color="#A68BFF"/><stop offset="1" stop-color="#9CECFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9CECFF" stop-opacity="0"/><stop offset=".5" stop-color="#E9E2FF"/><stop offset="1" stop-color="#9CECFF" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glowf" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="card"><rect width="1600" height="460" rx="28"/></clipPath>
  </defs>
  <style>
    .rise{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .breathe{animation:breathe 6s ease-in-out infinite;transform-origin:1090px 200px}
    @keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
    .tw{animation:tw 3.2s ease-in-out infinite}
    .tw2{animation:tw 4.1s ease-in-out infinite .8s}
    .tw3{animation:tw 2.7s ease-in-out infinite 1.4s}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
    .step{font-family:'DM Mono',Consolas,monospace;font-size:12px;letter-spacing:2.2px;fill:#8F8D9D;animation:hl 8s linear infinite}
    .s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}
    @keyframes hl{0%{fill:#F5F3FA}2%,24%{fill:#C7B5FF}26%,100%{fill:#8F8D9D}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1600" height="460" fill="url(#bg)"/>
    <rect class="breathe" width="1600" height="460" fill="url(#glow1)"/>
    <rect width="1600" height="460" fill="url(#glow2)"/>

    <!-- faint grid -->
    <g opacity=".05" stroke="#B6A5F1">
      <path d="M0 115H1600M0 230H1600M0 345H1600M200 0V460M400 0V460M600 0V460M800 0V460M1000 0V460M1200 0V460M1400 0V460"/>
    </g>

    <!-- orbital system -->
    <g opacity=".16" stroke="#B6A5F1">
      <circle cx="1265" cy="226" r="174"/><circle cx="1265" cy="226" r="140"/><circle cx="1265" cy="226" r="105"/>
    </g>
    <g opacity=".2" stroke="#B6A5F1">
      <g><ellipse cx="1265" cy="226" rx="174" ry="82" transform="rotate(-28 1265 226)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 1265 226" to="360 1265 226" dur="60s" repeatCount="indefinite"/></g>
      <g><ellipse cx="1265" cy="226" rx="174" ry="82" transform="rotate(28 1265 226)"/>
        <animateTransform attributeName="transform" type="rotate" from="360 1265 226" to="0 1265 226" dur="75s" repeatCount="indefinite"/></g>
    </g>

    <!-- orbiting bodies -->
    <g><circle cx="1265" cy="52" r="4" fill="#C4B4FF"/>
      <animateTransform attributeName="transform" type="rotate" from="0 1265 226" to="360 1265 226" dur="28s" repeatCount="indefinite"/></g>
    <g><circle cx="1125" cy="226" r="3" fill="#9CECFF"/>
      <animateTransform attributeName="transform" type="rotate" from="360 1265 226" to="0 1265 226" dur="16s" repeatCount="indefinite"/></g>
    <g><circle cx="1370" cy="226" r="3" fill="#C4B4FF"/>
      <animateTransform attributeName="transform" type="rotate" from="0 1265 226" to="360 1265 226" dur="11s" repeatCount="indefinite"/></g>

    <!-- pulsing core -->
    <circle cx="1265" cy="226" r="42" fill="#A68BFF" fill-opacity=".13" filter="url(#soft)">
      <animate attributeName="r" values="36;52;36" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values=".1;.22;.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1265" cy="226" r="6" fill="#9CECFF"/>
    <circle cx="1265" cy="226" r="6" stroke="#9CECFF" fill="none">
      <animate attributeName="r" values="6;48" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <circle class="tw" cx="1110" cy="340" r="2.5" fill="#9CECFF"/>
    <circle class="tw2" cx="1411" cy="290" r="3" fill="#C4B4FF"/>
    <circle class="tw3" cx="900" cy="80" r="2" fill="#C4B4FF"/>
    <circle class="tw2" cx="1520" cy="140" r="2" fill="#9CECFF"/>
    <circle class="tw" cx="760" cy="410" r="2" fill="#C4B4FF"/>
    <circle class="tw3" cx="1470" cy="400" r="2.5" fill="#9CECFF"/>

    <!-- rules + light sweep -->
    <path d="M95 104H1505" stroke="url(#line)" stroke-opacity=".45"/>
    <path d="M95 365H1505" stroke="url(#line)" stroke-opacity=".3"/>
    <rect y="103" width="220" height="2" fill="url(#sweep)" opacity=".9">
      <animate attributeName="x" values="-220;1600" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect y="364" width="220" height="2" fill="url(#sweep)" opacity=".7">
      <animate attributeName="x" values="1600;-220" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- logo mark -->
    <g class="rise d1" transform="translate(112 142)">
      <circle cx="21" cy="21" r="19" stroke="#C1B1FF" stroke-width="1.5"/>
      <circle cx="21" cy="21" r="10" stroke="#9CECFF" stroke-width="1.3"/>
      <g><circle cx="39" cy="6" r="3" fill="#9CECFF"/>
        <animateTransform attributeName="transform" type="rotate" from="0 21 21" to="360 21 21" dur="9s" repeatCount="indefinite"/></g>
    </g>

    <!-- copy -->
    <text class="rise d1" x="166" y="187" fill="#F5F3FA" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="70" font-weight="700" letter-spacing="-4">BrandLens</text>
    <text class="rise d2" x="116" y="255" fill="url(#accent)" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="35" font-weight="600" letter-spacing="-.8">Clarity in Every Impression.</text>
    <text class="rise d3" x="118" y="303" fill="#A5A3B2" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="19">Company-aware AI · Brand governance · Connected publishing</text>

    <!-- step ticker -->
    <g class="rise d4" transform="translate(118 392)">
      <text class="step">CREATE</text><circle cx="76" cy="-4" r="2" fill="#A68BFF"/>
      <text class="step s2" x="94">REVIEW</text><circle cx="180" cy="-4" r="2" fill="#9CECFF"/>
      <text class="step s3" x="198">IMPROVE</text><circle cx="300" cy="-4" r="2" fill="#A68BFF"/>
      <text class="step s4" x="318">PUBLISH</text>
    </g>
    <text x="1480" y="424" text-anchor="end" fill="#6F6D7C" font-family="'DM Mono',Consolas,monospace" font-size="10" letter-spacing="2">BL / 01</text>
  </g>
</svg>
